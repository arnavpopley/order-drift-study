[project]
name = "order-drift-study"
version = "0.1.0"
description = "Post-announcement drift in Indian order-win announcements"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "yfinance>=0.2",
    "python-dotenv>=1.0",
    "curl-cffi>=0.16.1",
    "google-genai>=2.19.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100
